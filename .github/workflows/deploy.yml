name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Everything tracked is the site, except the repository's own files.
      - name: Collect site
        run: |
          mkdir public
          git ls-files -z ':!:.github' ':!:.gitignore' ':!:AGENTS.md' ':!:wrangler.jsonc' | xargs -0 cp --parents -t public

      # The Cloudflare Worker serves the site as static assets.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
